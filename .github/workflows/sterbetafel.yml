name: Sterbetafel

# Einmal im Monat nachsehen, ob das Statistische Bundesamt eine neuere Sterbetafel veröffentlicht hat.
# Wenn ja: js/sterbetafel.js ersetzen, Service Worker neu bauen, alle Tests laufen lassen und nur bei
# grünen Tests auf main übernehmen. Manuell starten: Actions → Sterbetafel → Run workflow.
# Hinweis: GitHub pausiert zeitgesteuerte Workflows, wenn im Repository 60 Tage nichts passiert ist —
# dann einmal manuell starten oder unter Actions wieder aktivieren.
on:
  schedule:
    - cron: '17 4 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sterbetafel
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # dasselbe Image wie im Workflow „Tests“ (dort stehen die Gründe)
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Abhängigkeiten
        run: python -m pip install -r tests/requirements.txt

      - name: Neueste Sterbetafel suchen
        id: tafel
        run: |
          set -o pipefail
          python scripts/sterbetafel.py | tee tafel.log
          if git diff --quiet -- js/sterbetafel.js; then
            echo "neu=nein" >> "$GITHUB_OUTPUT"
          else
            echo "neu=ja" >> "$GITHUB_OUTPUT"
            echo "zeitraum=$(grep -o "zeitraum:'[0-9/]*'" js/sterbetafel.js | cut -d"'" -f2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Service Worker bauen und alle Tests
        if: steps.tafel.outputs.neu == 'ja'
        run: |
          npm ci
          npm run build
          npm run test:unit
          npx playwright test

      - name: Auf main übernehmen
        if: steps.tafel.outputs.neu == 'ja'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/sterbetafel.js sw.js
          git commit -m "Sterbetafel ${{ steps.tafel.outputs.zeitraum }} übernommen (Statistisches Bundesamt)" \
                     -m "Automatisch ersetzt durch den Workflow „Sterbetafel“ nach erfolgreichem Testlauf."
          git push origin HEAD:main

      # Pushes mit dem Workflow-Token starten keine anderen Workflows; die Seite ausdrücklich neu bauen lassen
      - name: GitHub Pages neu bauen
        if: steps.tafel.outputs.neu == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "fetch('https://api.github.com/repos/${{ github.repository }}/pages/builds',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}}).then(async r=>{console.log(r.status,await r.text());if(!r.ok)console.log('::warning::Pages-Build nicht angestoßen – er startet sonst mit dem nächsten Push.')})"

      - name: Testbericht sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sterbetafel-testbericht
          path: |
            tafel.log
            playwright-report/
            test-results/
          retention-days: 14
