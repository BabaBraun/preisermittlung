name: Klicktest

# Die App wird durchgeklickt (tests/klick/klicktest.mjs): jeder Knopf, jedes Feld, jedes Auf- und Zuklappen —
# am PC (Chromium) und in der iPhone-Ansicht (WebKit). Läuft nur noch auf Anfrage (Actions → Klicktest → „Run workflow“),
# nicht mehr bei jedem Push oder wöchentlich: Die bestehenden Bereiche liefen oft genug ohne Befund (Wunsch von Fabian,
# 04.10.2026). Mit „Bereiche“ lässt sich der Lauf auf neue oder geänderte Bereiche beschränken (sonst ganze App, rund eine
# Stunde je Gerät). Ein neuerer Lauf bricht den laufenden ab.
on:
  workflow_dispatch:
    inputs:
      nur:
        description: 'Bereiche (Regex, z. B. "Makler|Schlüsselbuch"); leer = ganze App'
        required: false
        default: ''

concurrency:
  group: klicktest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  klicktest:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # wie tests.yml: offizielles Playwright-Image (Chromium, WebKit, Systembibliotheken); Version passend zu package.json
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        geraet: [desktop, iphone]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Klicktest ${{ matrix.geraet }}
        env:
          NUR: ${{ inputs.nur }}
        run: node tests/klick/klicktest.mjs ${{ matrix.geraet }} ${NUR:+"--nur=$NUR"}

      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: klicktest-${{ matrix.geraet }}
          path: tests/ausgabe/klicktest/
          retention-days: 14
