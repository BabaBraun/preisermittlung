name: Native iOS
on:
  pull_request:
  workflow_dispatch:
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native App bauen und testen
        run: |
          native_sim_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcodebuild test -project ios/ImmoAppNative.xcodeproj -scheme ImmoApp -destination "platform=iOS Simulator,id=$native_sim_id" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO -resultBundlePath native-tests.xcresult
      - name: Testergebnis sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-tests
          path: native-tests.xcresult
