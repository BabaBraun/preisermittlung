name: ImmoAppNative
options:
  bundleIdPrefix: de.immoapp
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '3'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: ImmoApp
    INFOPLIST_KEY_NSFaceIDUsageDescription: Lokale Immobilienbewertungen schützen.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Objektfotos und Grundrisse hinzufügen.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  ImmoApp:
    type: application
    platform: iOS
    sources:
      - path: ImmoApp
        excludes: [Resources]
      - path: ImmoApp/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.immoapp.preisermittlung
  ImmoAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ImmoAppTests]
    dependencies:
      - target: ImmoApp
  ImmoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ImmoAppUITests]
    dependencies:
      - target: ImmoApp
schemes:
  ImmoApp:
    build:
      targets:
        ImmoApp: all
    test:
      targets: [ImmoAppTests, ImmoAppUITests]
